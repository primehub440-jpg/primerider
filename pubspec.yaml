name: primerider
description: Prime Rider - Real Firebase + Map + Bell + Chat + Earning Calendar + Zone + COD Deposit
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  firebase_core: ^2.24.0
  cloud_firestore: ^4.17.0
  firebase_storage: ^11.6.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  image_picker: ^1.0.7
  audioplayers: ^6.8.1
  flutter_local_notifications: ^17.0.0
  vibration: ^3.2.1
  table_calendar: ^3.0.9
  intl: ^0.19.0
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/icon.png
    - assets/sounds/bell.mp3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21
  web:
    generate: false